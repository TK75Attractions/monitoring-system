name: Proto
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        command: ["lint", "format -w ", "generate"]
        
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@219c9aef02e8f6a27e4b46274db239ef513f5d53
        with:
          setup_only: true
      - name: Run command
        run: buf ${{matrix.command}}
