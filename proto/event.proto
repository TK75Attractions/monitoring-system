syntax = "proto3";

package tk75attractions.monitoring.v1;

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_STARTED = 1;
  EVENT_KIND_FINISHED = 2;
}

message EventPacket {
  int64 occured_at = 1;
  oneof data {
    StruckoutEvent struckout = 2;
  }
}

message StruckoutEvent {
  enum Difficulty {
    DIFFICULTY_UNSPECIFIED = 0;
    DIFFICULTY_NORMAL = 1;
    DIFFICULTY_HARD = 2;
    DIFFICULTY_VERYHARD = 3;
  }

  EventKind kind = 1;
  Difficulty difficulty = 2;
}
